<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Compartilhar tela</title>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #12151a;
        --card: #171b21;
        --line: rgba(255, 255, 255, 0.07);
        --text: #e5e7eb;
        --muted: #8b93a1;
        --green: #22c55e;
        --green-d: #16a34a;
        --gold: #e9c25a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }
      body { display: flex; flex-direction: column; user-select: none; }
      header { padding: 18px 22px 0; }
      h1 { margin: 0; font-size: 18px; font-weight: 700; }
      .sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
      .tabs { display: flex; gap: 6px; margin: 14px 0 0; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: max-content; }
      .tab { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
      .tab[aria-selected='true'] { background: #262c35; color: #fff; }
      .tab .count { margin-left: 6px; font-size: 11px; color: var(--muted); }
      .row { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
      .row .tabs { margin: 0; }
      .search { flex: 1; min-width: 180px; max-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font: inherit; font-size: 13px; padding: 8px 12px; outline: none; }
      .search:focus { border-color: rgba(34, 197, 94, 0.5); }
      .search[hidden] { display: none; }
      .live { font-size: 11px; color: var(--muted); margin-left: auto; }
      main { flex: 1; overflow-y: auto; padding: 16px 22px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
      .card { background: var(--card); border: 2px solid transparent; border-radius: 14px; padding: 8px; cursor: pointer; text-align: left; color: inherit; font: inherit; transition: border-color 0.12s, background 0.12s; }
      .card:hover { background: #1c2128; }
      .card[aria-pressed='true'] { border-color: var(--green); background: #16201a; }
      .thumb { aspect-ratio: 16 / 9; width: 100%; border-radius: 9px; background: #07080a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .thumb img { width: 100%; height: 100%; object-fit: contain; }
      .name { display: flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 13px; overflow: hidden; }
      .name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .name img { width: 16px; height: 16px; flex: none; }
      .empty { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }
      footer { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
      .audio { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
      .audio input { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; }
      .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .note.warn { color: var(--gold); }
      .spacer { flex: 1; }
      button.btn { border: 1px solid var(--line); border-radius: 12px; padding: 10px 18px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
      .ghost { background: #1c2128; color: var(--text); }
      .ghost:hover { background: #242a33; }
      .primary { background: var(--green-d); color: #fff; border-color: transparent; }
      .primary:hover { background: var(--green); }
      .primary:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <header>
      <h1>O que você quer compartilhar?</h1>
      <p class="sub">Clique duas vezes para compartilhar na hora. As miniaturas se atualizam sozinhas.</p>
      <div class="row">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-kind="screen" aria-selected="true">Telas inteiras<span class="count" id="cScreen"></span></button>
          <button class="tab" role="tab" data-kind="window" aria-selected="false">Janelas<span class="count" id="cWindow"></span></button>
        </div>
        <input class="search" id="search" type="search" placeholder="Procurar janela..." hidden />
        <span class="live" id="live"></span>
      </div>
    </header>
    <main><div class="grid" id="grid"></div></main>
    <footer>
      <div id="audioBox">
        <label class="audio"><input type="checkbox" id="audio" checked /> Compartilhar o som do computador</label>
        <div class="note" id="note"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn ghost" id="cancel">Cancelar</button>
      <button class="btn primary" id="share" disabled>Compartilhar</button>
    </footer>
    <script>
      const grid = document.getElementById('grid');
      const shareBtn = document.getElementById('share');
      const audioEl = document.getElementById('audio');
      const note = document.getElementById('note');
      const search = document.getElementById('search');
      const live = document.getElementById('live');
      let data = { sources: [] };
      let kind = 'screen';
      let selected = null;
      let first = true;
      let busy = false;

      function el(tag, attrs, children) {
        const n = document.createElement(tag);
        Object.assign(n, attrs || {});
        (children || []).forEach((c) => c && n.appendChild(c));
        return n;
      }

      function selectedSource() {
        return data.sources.find((s) => s.id === selected) || null;
      }

      function setKind(k) {
        kind = k;
        document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', String(x.dataset.kind === k)));
        search.hidden = k !== 'window';
        render();
      }

      function render() {
        grid.textContent = '';
        const q = search.value.trim().toLowerCase();
        const all = data.sources.filter((s) => s.kind === kind);
        const list = kind === 'window' && q ? all.filter((s) => s.name.toLowerCase().includes(q)) : all;
        document.getElementById('cScreen').textContent = String(data.sources.filter((s) => s.kind === 'screen').length || '');
        document.getElementById('cWindow').textContent = String(data.sources.filter((s) => s.kind === 'window').length || '');
        shareBtn.disabled = !selectedSource();
        if (!list.length) {
          const msg = kind === 'screen' ? 'Nenhuma tela encontrada.' : q ? 'Nenhuma janela com esse nome.' : 'Nenhuma janela aberta.';
          grid.appendChild(el('div', { className: 'empty', textContent: msg }));
          return;
        }
        for (const s of list) {
          const thumb = el('div', { className: 'thumb' }, [s.thumbnail ? el('img', { src: s.thumbnail, alt: '' }) : null]);
          const name = el('div', { className: 'name' }, [s.icon ? el('img', { src: s.icon, alt: '' }) : null, el('span', { textContent: s.name, title: s.name })]);
          const card = el('button', { className: 'card', type: 'button' }, [thumb, name]);
          card.setAttribute('aria-pressed', String(selected === s.id));
          card.onclick = () => {
            selected = s.id;
            render();
          };
          card.ondblclick = () => {
            selected = s.id;
            share();
          };
          grid.appendChild(card);
        }
      }

      function share() {
        const s = selectedSource();
        if (!s) return;
        window.picker.choose(s.id, audioEl.checked && data.audioRequested && data.audioSupported, s.name);
      }

      document.querySelectorAll('.tab').forEach((t) => {
        t.onclick = () => setKind(t.dataset.kind);
      });
      search.oninput = render;
      shareBtn.onclick = share;
      document.getElementById('cancel').onclick = () => window.picker.cancel();
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') window.picker.cancel();
        if (e.key === 'Enter' && document.activeElement !== search) share();
        if (e.key === 'Enter' && document.activeElement === search) {
          // Enter na busca: se sobrou uma janela só, compartilha ela
          const q = search.value.trim().toLowerCase();
          const hits = data.sources.filter((s) => s.kind === 'window' && s.name.toLowerCase().includes(q));
          if (hits.length === 1) {
            selected = hits[0].id;
            share();
          }
        }
      });

      async function load() {
        if (busy) return;
        busy = true;
        try {
          const next = (await window.picker.getSources()) || { sources: [] };
          data = next;
        } catch {
          busy = false;
          return;
        }
        busy = false;
        if (first) {
          first = false;
          const prefs = data.prefs || {};
          if (!data.audioRequested || !data.audioSupported) {
            audioEl.checked = false;
            audioEl.disabled = true;
            note.textContent = data.audioSupported ? 'O Vault não pediu áudio para este compartilhamento.' : 'Som do computador só funciona no Windows.';
          } else {
            audioEl.checked = prefs.audio !== false;
            if (data.excludesOwnAudio) {
              note.textContent = 'Vai junto o som de jogos, vídeos e músicas. A voz da chamada fica de fora (sem eco).';
            } else {
              note.textContent = 'Windows 10 não consegue separar o som da chamada: quem estiver na call pode ouvir eco da própria voz. Desmarque se não precisar do som.';
              note.className = 'note warn';
            }
          }
          // Já vem marcado o que foi compartilhado da última vez (se ainda existir)
          const last = prefs.lastName ? data.sources.find((s) => s.name === prefs.lastName && s.kind === prefs.kind) : null;
          const screens = data.sources.filter((s) => s.kind === 'screen');
          if (last) selected = last.id;
          else if (screens.length === 1) selected = screens[0].id;
          kind = last ? last.kind : prefs.kind === 'window' ? 'window' : 'screen';
          setKind(kind);
        } else {
          // a janela escolhida foi fechada enquanto o seletor estava aberto
          if (selected && !selectedSource()) selected = null;
          render();
        }
        live.textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }
      load();
      // Janelas abertas/fechadas e miniaturas novas aparecem sem precisar reabrir o seletor
      setInterval(() => {
        if (document.visibilityState === 'visible') load();
      }, 3000);
    </script>
  </body>
</html>
