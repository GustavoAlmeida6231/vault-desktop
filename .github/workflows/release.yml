name: Publicar versão

# Cada push na main publica a versão que está no package.json (veja VERSIONING.md: todo push precisa subir a versão).
# O Vault instalado nos computadores encontra essa versão sozinho e mostra o ícone verde de atualização.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Ler versão do package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "A versão v$VERSION já foi publicada. Suba a versão no package.json (veja VERSIONING.md) e envie de novo."
            exit 1
          fi

      # Gera o instalador + latest.yml (o arquivo que o app consulta para saber se há versão nova)
      - name: Gerar instalador
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Publica tudo numa Release vX.Y.Z (o app procura a Release mais recente)
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Vault ${{ env.VERSION }}
          body: Baixe o arquivo Vault-Setup-${{ env.VERSION }}.exe abaixo e abra para instalar. Quem já tem o Vault instalado recebe esta versão sozinho.
          make_latest: true
          files: |
            dist/Vault-Setup-${{ env.VERSION }}.exe
            dist/Vault-Setup-${{ env.VERSION }}.exe.blockmap
            dist/latest.yml
