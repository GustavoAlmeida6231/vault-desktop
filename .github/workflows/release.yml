name: Publicar versão

# Cada push na main gera uma versão nova (1.2.<número da execução>) e publica em Releases.
# O Vault instalado nos computadores encontra essa versão sozinho e mostra o ícone verde de atualização.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Definir versão
        run: |
          npm version "1.2.${{ github.run_number }}" --no-git-tag-version
          echo "VERSION=1.2.${{ github.run_number }}" >> $env:GITHUB_ENV

      # Gera o instalador + latest.yml (o arquivo que o app consulta para saber se há versão nova)
      - name: Gerar instalador
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Publica tudo numa Release v1.2.N (o app procura a Release mais recente)
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Vault ${{ env.VERSION }}
          body: Baixe o arquivo Vault-Setup-${{ env.VERSION }}.exe abaixo e abra para instalar. Quem já tem o Vault instalado recebe esta versão sozinho.
          make_latest: true
          files: |
            dist/Vault-Setup-${{ env.VERSION }}.exe
            dist/Vault-Setup-${{ env.VERSION }}.exe.blockmap
            dist/latest.yml
